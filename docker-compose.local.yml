services:
  app:
    build: .
    container_name: appAIElement
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v26.0}
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
    volumes:
      - appdb:/app/data

volumes:
  appdb:
